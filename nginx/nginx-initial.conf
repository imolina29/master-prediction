# Temporary HTTP-only config for initial SSL certificate provisioning.
# After obtaining certs, replace with nginx.conf and restart nginx.
server {
    listen 80;
    server_name masterprediction.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
